<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>合同管理系统</title>
<!--
  合同管理系统（P21.2 · Vue 3 重写）—— 需求第 1/2/3 条
    ① VueJS 实现、支持懒加载与动态生成、标准属性（id/class/title/placeholder/readonly/autocomplete）+ 自定义属性（data-*）
    ② 搜索栏对齐；**每个搜索条件的 label 是独立 div，label 内不含任何子控件**；每个控件包在多层 div（>5 层、≤12 层）
    ③ 「…」选客户 ⇒ 弹出「选择客户」**iframe**（同源 pick_customer.html，Vue 实现），进 iframe 才能选

  契约（不许破 —— references/demo-refactor-contract.md）：
    · 就绪契约 body[data-hybrid-ready] 0 → 1（数据渲染完成）
    · 埋点口径 C：只有顶层容器带 data-testid（tbl-contracts / status / modal-new / modal-customer）
    · 接口：GET /api/contracts · GET /api/customers · POST /api/contracts（均支持 ?w= 分区）
    · 列定位：td[data-field] 保留（contractNo/contractName/managementUnit/folder/contractType/customer/businessUnit）
    · 客户筛选语义保留：**右模糊（前缀）匹配**，客户名前缀或客户编号前缀
-->
<script src="vendor/vue.global.prod.js"></script>
<script src="auth.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; color: #1f2329; background: #f5f6f8; }
  .topbar { display: flex; align-items: center; gap: 16px;
            padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e4e8; }
  .topbar h2 { font-size: 16px; margin: 0; }
  .topbar .total { color: #4b5058; }
  .topbar .spacer { flex: 1 1 auto; }
  #link-orders { font-size: 13px; color: #2f6fed; }
  #btn-new { height: 30px; padding: 0 14px; background: #1668dc; color: #fff; border: 1px solid #1668dc; border-radius: 3px; cursor: pointer; }

  /* 搜索工具栏：样式对齐 —— 每个条件等宽、label 等宽、控件等宽 */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
             padding: 12px 16px; background: #fff; border-bottom: 1px solid #e2e4e8; }
  .cond { display: flex; align-items: center; width: 320px; }
  .cond > .label { flex: 0 0 76px; text-align: right; padding-right: 8px; color: #4b5058; }  /* 独立 div，不含子控件 */
  .cond .ctl { flex: 1 1 auto; }
  .cond .ctl input, .cond .ctl select { width: 100%; height: 28px; padding: 0 8px;
             border: 1px solid #c9ccd2; border-radius: 3px; background: #fff; font: inherit; }
  .pick-row { display: flex; gap: 6px; }
  .pick-row input { flex: 1 1 auto; }
  .pick-row .pick { flex: 0 0 auto; width: 28px; height: 28px; border: 1px solid #c9ccd2;
             background: #fff; border-radius: 3px; cursor: pointer; }
  .tb-actions { display: flex; gap: 8px; margin-left: auto; }
  .btn { height: 28px; padding: 0 12px; border: 1px solid #c9ccd2; background: #fff; border-radius: 3px; cursor: pointer; font: inherit; }
  .btn.primary { background: #1668dc; border-color: #1668dc; color: #fff; }
  .btn[disabled] { color: #b6b9bf; background: #f2f3f5; cursor: not-allowed; }

  /* 表格 */
  .grid-wrap { padding: 12px 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #e2e4e8; padding: 6px 9px; text-align: left; }
  th { background: #fafbfc; font-weight: 600; }
  tbody tr:hover { background: #f0f6ff; }
  #status { padding: 8px 16px; color: #1668dc; min-height: 20px; }

  /* 弹层 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex;
           align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: #fff; border-radius: 4px; width: 460px; max-height: 88vh; overflow: auto; padding: 16px; }
  .modal-box.wide { width: 620px; }
  .modal-box h3 { margin: 0 0 12px; font-size: 15px; }
  .field { display: flex; align-items: center; margin-bottom: 10px; }
  .field > .label { flex: 0 0 84px; text-align: right; padding-right: 8px; color: #4b5058; }  /* 独立 div label */
  .field .ctl { flex: 1 1 auto; }
  .field .ctl input, .field .ctl select { width: 100%; height: 28px; padding: 0 8px;
             border: 1px solid #c9ccd2; border-radius: 3px; background: #fff; font: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #frame-customer { width: 100%; height: 340px; border: 1px solid #e2e4e8; border-radius: 3px; }
</style>
</head>
<body data-hybrid-ready="0">
<div id="app">

  <div class="topbar">
    <h2>合同管理系统</h2>
    <!-- 共 N 条合同（2026-09-17 起的老口径，P21.2 重写时丢失、2026-09-28 找回）：
         数字 = **筛选后的行数**（老实现 `total.textContent = data.length`）
         ⇒ 两个场景的断言护栏 must_contain「条合同」依赖这行文本，别删 -->
    <div class="total">共 <span id="total">{{ rows.length }}</span> 条合同</div>
    <div class="spacer"></div>
    <!-- 订单系统入口（2026-09-17 需求①，同批丢失、2026-09-28 找回）：
         点击**新开一个 tab** 打开订单列表页 orders.html（框架靠 role=link name=查看订单 定位） -->
    <a id="link-orders" href="/orders.html" target="_blank" rel="noopener">查看订单</a>
    <button id="btn-new" type="button" data-perm="create_contract"
            data-perm-tip="「新建合同」需要合同管理员角色：当前不是合同管理员，不能新建合同（可用右上角头像切换角色）"
            @click="openNew">+ 新建合同</button>
    <!-- 需求⑮：登录身份 + 超管切换角色的头像（auth.js 渲染） -->
    <div id="nav-user" class="nav-user"></div>
  </div>

  <!-- ===== 搜索工具栏：每个条件 = 独立 label div（不含子控件） + 控件包在 8 层 div 里 ===== -->
  <div class="toolbar" id="search-toolbar" aria-label="搜索工具栏">
    <div class="cond" v-for="c in conds" :key="c.key">
      <div class="label">{{ c.label }}</div>
      <div class="ctl w1"><div class="w2"><div class="w3"><div class="w4">
        <div class="w5"><div class="w6"><div class="w7"><div class="w8">
          <template v-if="c.type === 'pick'">
            <div class="pick-row">
              <input :id="c.id" :name="c.key" type="text" :title="c.label" :aria-label="c.label"
                     :placeholder="c.ph" autocomplete="off" v-model="f[c.key]"
                     @keyup.enter="load">
              <button type="button" class="pick" :id="c.btnId" :title="'选择' + c.label"
                      @click="openPick('cust-search')">...</button>
            </div>
          </template>
          <template v-else-if="c.type === 'select'">
            <select :id="c.id" :name="c.key" :title="c.label" :aria-label="c.label" v-model="f[c.key]">
              <option value="">{{ c.ph }}</option>
              <option v-for="o in c.options" :key="o.v" :value="o.v">{{ o.t }}</option>
            </select>
          </template>
          <template v-else>
            <input :id="c.id" :name="c.key" type="text" :title="c.label" :aria-label="c.label"
                   :placeholder="c.ph" autocomplete="off" v-model="f[c.key]" @keyup.enter="load">
          </template>
        </div></div></div></div>
      </div></div></div></div>
    </div>

    <div class="tb-actions">
      <button id="btn-search" class="btn primary" type="button" @click="load">搜索</button>
      <button id="btn-reset" class="btn" type="button" @click="reset">重置</button>
      <button id="btn-export" class="btn" type="button" disabled title="导出功能未接入">导出</button>
    </div>
  </div>

  <!-- ===== 合同列表（顶层容器 = 唯一允许埋点处） ===== -->
  <div class="grid-wrap">
    <table id="tbl-contracts" data-testid="tbl-contracts" aria-label="合同列表">
      <thead>
        <tr>
          <th>合同编号</th><th>合同名称</th><th>管理单元</th><th>帐套</th>
          <th>合同类型</th><th>客户</th><th>业务单元</th>
        </tr>
      </thead>
      <tbody id="tbody-contracts">
        <tr v-for="c in rows" :key="c.no">
          <td data-field="contractNo"><a :href="'/contract_detail.html?no=' + c.no">{{ c.no }}</a></td>
          <td data-field="contractName">{{ c.name }}</td>
          <td data-field="managementUnit">{{ c.mu }}</td>
          <td data-field="folder">{{ c.file }}</td>
          <td data-field="contractType">{{ c.type }}</td>
          <td data-field="customer" :data-cust="c.cust">{{ custName(c) }}</td>
          <td data-field="businessUnit">{{ c.bu }}</td>
        </tr>
        <tr v-if="!rows.length"><td colspan="7">没有匹配的合同</td></tr>
      </tbody>
    </table>
  </div>
  <div id="status" data-testid="status">{{ status }}</div>

  <!-- ===== 新建合同弹窗 ===== -->
  <div id="modal-new" class="modal" data-testid="modal-new" v-if="showNew">
    <div class="modal-box">
      <h3>新建合同</h3>

      <div class="field">
        <div class="label">合同名称</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <input id="inp-name" name="contractName" type="text" title="合同名称" aria-label="合同名称"
                 placeholder="请输入合同名称" autocomplete="off" v-model="form.name">
        </div></div></div></div></div></div>
      </div>

      <div class="field">
        <div class="label">管理单元</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <select id="sel-mu" name="managementUnit" title="管理单元" aria-label="管理单元" v-model="form.mu">
            <option value="">请选择</option>
            <option value="0021">0021</option><option value="0451">0451</option><option value="1031">1031</option>
          </select>
        </div></div></div></div></div></div>
      </div>

      <div class="field">
        <div class="label">帐套</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <select id="sel-fs" name="folder" title="帐套" aria-label="帐套" v-model="form.file">
            <option value="">请选择</option>
            <option value="001">001</option><option value="002">002</option><option value="003">003</option>
          </select>
        </div></div></div></div></div></div>
      </div>

      <div class="field">
        <div class="label">合同类型</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <select id="sel-type" name="contractType" title="合同类型" aria-label="合同类型" v-model="form.type">
            <option value="">请选择</option>
            <option value="合同">合同</option><option value="po">po</option><option value="预po">预po</option>
          </select>
        </div></div></div></div></div></div>
      </div>

      <div class="field">
        <div class="label">客户</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <div class="pick-row">
            <input id="inp-c" name="customer" type="text" title="客户" aria-label="客户"
                   placeholder="请选择客户" readonly autocomplete="off" v-model="form.cust">
            <button id="btn-pick-c" class="btn" type="button" title="选择客户" @click="openPick('cust')">选择客户</button>
          </div>
        </div></div></div></div></div></div>
      </div>

      <div class="field">
        <div class="label">业务单元</div>
        <div class="ctl n1"><div class="n2"><div class="n3"><div class="n4"><div class="n5"><div class="n6">
          <select id="sel-b" name="businessUnit" title="业务单元" aria-label="业务单元" v-model="form.bu">
            <option value="">请选择</option>
            <option value="bu_a">bu_a</option><option value="bu_b">bu_b</option><option value="bu_c">bu_c</option>
          </select>
        </div></div></div></div></div></div>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn" type="button" @click="showNew = false">取消</button>
        <button id="btn-submit" class="btn primary" type="button" @click="submit">提交</button>
      </div>
    </div>
  </div>

  <!-- ===== 选择客户：**iframe**（需求③）—— 进 iframe 才能选到客户 ===== -->
  <div id="modal-customer" class="modal" data-testid="modal-customer" v-if="showCust">
    <div class="modal-box wide">
      <h3>选择客户</h3>
      <iframe id="frame-customer" :src="frameSrc" title="选择客户" name="frame-customer"></iframe>
      <div class="modal-actions">
        <button id="btn-cust-cancel" class="btn" type="button" @click="closeCust">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

// 分区号（F6 契约）：**框架用 context.add_init_script 注入 window.__HYBRID_W**（pytest-xdist 每 worker 一个分区）
// ⇒ 必须优先读它；手工浏览时退回 URL 的 ?w=<分区>。只读 ?w= 会让框架驱动时全落 default 分区，并发互相踩。
const PART = String(window.__HYBRID_W || '').trim() || (new URLSearchParams(location.search).get('w') || '');
function markBusy() { document.body.dataset.hybridReady = '0'; }
function markReady() { document.body.dataset.hybridReady = '1'; }
function apiUrl(path) {
  // 需求⑮：带上身份（token 或自动化用的 ?demo_role=），页面自己的 ?w=<分区> 先拼
  return DEMO_AUTH.url(PART ? path + (path.includes('?') ? '&' : '?') + 'w=' + encodeURIComponent(PART) : path);
}

createApp({
  data() {
    const MUS = ['0021', '0451', '1031'], FILES = ['001', '002', '003'];
    const TYPES = ['合同', 'po', '预po'], BUS = ['bu_a', 'bu_b', 'bu_c'];
    return {
      // 动态生成搜索条件（需求①：动态生成）—— label 独立 div、控件包多层 div
      conds: [
        { key: 'kw',    label: '关键字',   id: 'tb-keyword',   type: 'text',   ph: '合同编号/名称/管理单元/合同类型/帐套' },
        { key: 'cust',  label: '客户',     id: 'tb-customer',  type: 'pick',   ph: '客户名称（右模糊：前缀匹配）', btnId: 'btn-pick-c-search' },
        { key: 'mu',    label: '管理单元', id: 'tb-mu',        type: 'select', ph: '全部管理单元', options: MUS.map(v => ({ v, t: v })) },
        { key: 'file',  label: '帐套',     id: 'tb-fs',        type: 'select', ph: '全部帐套',     options: FILES.map(v => ({ v, t: v })) },
        { key: 'type',  label: '合同类型', id: 'tb-type',      type: 'select', ph: '全部类型',     options: TYPES.map(v => ({ v, t: v })) },
        { key: 'bu',    label: '业务单元', id: 'sel-bu',       type: 'select', ph: '全部业务单元', options: BUS.map(v => ({ v, t: v })) },
      ],
      f: { kw: '', cust: '', mu: '', file: '', type: '', bu: '' },
      rows: [], all: [], customers: [], status: '',
      showNew: false, showCust: false, pickTarget: '', frameSrc: '',
      form: { name: '', mu: '', file: '', type: '', cust: '', bu: '' },
    };
  },
  mounted() {
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'pick-customer') {
        if (this.pickTarget === 'cust-search') { this.f.cust = d.name; }
        else { this.form.cust = d.name; }
        this.closeCust();
      }
    });
    this.load();
  },
  watch: {
    // 需求⑱：所有校验/提示信息都弹一个「弹出框 tips」；
    // ⚠️ 状态行**保留同样文字**（自动化判据/用例按状态行取值），所以这里是"加弹窗"而不是"挪走文字"
    status(v) { if (v) window.DEMO_TIPS.show(v); },
  },
  methods: {
    async load() {
      markBusy();
      this.customers = await (await fetch(apiUrl('/api/customers'))).json();
      this.all = await (await fetch(apiUrl('/api/contracts'))).json();
      this.rows = this.filterRows(this.all);
      markReady();
    },
    custName(c) { const t = this.customers.find(x => x.name === c.cust || x.no === c.cust); return t ? t.name : c.cust; },
    filterRows(list) {
      const kw = (this.f.kw || '').trim(), cust = (this.f.cust || '').trim().toLowerCase();
      return list.filter(c => {
        if (kw && !(c.no.includes(kw) || (c.name || '').includes(kw) || (c.mu || '').includes(kw)
                 || (c.file || '').includes(kw) || (c.type || '').includes(kw))) return false;
        // 客户：右模糊（前缀）匹配 —— 客户名称前缀 或 客户编号前缀
        if (cust) {
          const nm = this.custName(c).toLowerCase(), cd = (c.cust || '').toLowerCase();
          if (!(nm.startsWith(cust) || cd.startsWith(cust))) return false;
        }
        if (this.f.mu && c.mu !== this.f.mu) return false;
        if (this.f.file && c.file !== this.f.file) return false;
        if (this.f.type && c.type !== this.f.type) return false;
        if (this.f.bu && c.bu !== this.f.bu) return false;
        return true;
      });
    },
    reset() { this.f = { kw: '', cust: '', mu: '', file: '', type: '', bu: '' }; this.load(); },
    openNew() { this.form = { name: '', mu: '', file: '', type: '', cust: '', bu: '' }; this.showNew = true; },
    // 打开「选择客户」iframe（搜索栏用的按钮 ⇒ 回填搜索条件；弹窗里的按钮 ⇒ 回填表单）
    openPick(which) {
      this.pickTarget = (which === 'cust-search') ? 'cust-search' : 'cust';
      const q = new URLSearchParams();
      if (PART) q.set('w', PART);
      q.set('_t', String(Date.now()));
      this.frameSrc = 'pick_customer.html?' + q.toString();
      this.showCust = true;
    },
    closeCust() { this.showCust = false; this.frameSrc = ''; },
    async submit() {
      if (!this.form.name) { this.status = '请填写合同名称'; return; }
      const r = await fetch(apiUrl('/api/contracts'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: this.form.name, mu: this.form.mu, file: this.form.file,
                               type: this.form.type, cust: this.form.cust, bu: this.form.bu }),
      });
      if (r.ok) { const c = await r.json(); this.status = '已创建合同 ' + (c.no || c.name); this.showNew = false; await this.load(); }
      else { this.status = '创建失败：' + r.status; }
    },
  },
}).mount('#app');
// 需求⑮：登录与角色（未登录 ⇒ 跳 /login.html；已登录 ⇒ 按 data-perm 置灰 + 右上角头像）
DEMO_AUTH.init();
</script>
</body>
</html>
