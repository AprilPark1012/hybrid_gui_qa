<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>合同详情</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222;}
  .topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;
          border-bottom:1px solid #e3e6ea;padding:14px 22px;}
  h1{font-size:18px;margin:0;}
  .wrap{max-width:820px;margin:22px auto;background:#fff;border:1px solid #e3e6ea;
        border-radius:8px;padding:22px 26px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef0f3;}
  th{width:150px;color:#666;font-weight:400;background:#fafbfc;}
  .actions{margin-top:18px;display:flex;gap:10px;}
  button,.btn{font:inherit;padding:7px 16px;border-radius:6px;border:1px solid #cfd4da;
              background:#fff;cursor:pointer;text-decoration:none;color:#222;display:inline-block;}
  .primary{background:#2f6fed;border-color:#2f6fed;color:#fff;}
  #status{margin-top:14px;color:#0a0;}
  .empty{color:#c0392b;}
</style>
</head>
<!-- 就绪契约（F1）：静态声明 data-hybrid-ready="0"，数据渲染完成后由 JS 置 "1"；
     测试框架 goto 之后等它 ⇒ 慢机器/高并发下不再「页面还在取数、脚本已经开始点」。 -->
<body data-hybrid-ready="0">
<!-- 2026-09-14 改造（AprilPark1012拍板需求②）：这页不再**按编号序号推导**字段，而是直接读服务端
     /api/contract?no=<编号> 的**真实记录** —— 所以新建的合同在详情页看到的是它真正的客户，
     列表页与详情页的七个字段都是同一条记录、天然一致。
     查不到编号时如实报「未找到该合同」，**不再给任何编号都编一份出来**（以前 HT-2500
     这种不存在的编号也会渲染出客户，会让人误以为数据是对的）。 -->
<div class="topbar">
  <h1>合同详情</h1>
  <span>
    <span id="hint" style="font-size:13px;color:#888;"></span>
    <!-- 2026-09-17 需求⑥：从订单页点「合同编号」打开时标记来源（此时按钮文案是「返回」且关闭本 tab） -->
    <span id="from-hint" style="font-size:13px;color:#2f6fed;margin-left:8px;"></span>
  </span>
</div>

<div class="wrap">
  <table aria-label="合同详情">
    <tbody>
      <tr><th>合同编号</th><td id="d-no">—</td></tr>
      <tr><th>合同名称</th><td id="d-name">—</td></tr>
      <tr><th>管理单元</th><td id="d-mu">—</td></tr>
      <tr><th>帐套</th><td id="d-file">—</td></tr>
      <tr><th>合同类型</th><td id="d-type">—</td></tr>
      <tr><th>客户</th><td id="d-cust">—</td></tr>
      <tr><th>业务单元</th><td id="d-bu">—</td></tr>
    </tbody>
  </table>

  <div class="actions">
    <!-- 正常入口（从合同列表点进来）：返回列表 = 回合同列表页。
         注意：2026-09-17 需求⑥ —— 从**订单页**点「合同编号」进来时（?from=order），
         本按钮文案变成「返回」，点击是**关闭本 tab**（回到订单系统页面）。见下方 applyBackMode()。 -->
    <a class="btn" id="btn-back" href="/">返回列表</a>
    <button class="primary" id="btn-edit" type="button">编辑（未接入）</button>
  </div>
  <!-- 2026-09-13：这页也有一个「搜索」—— 故意与列表页同名，用来真页验证
       P3 的「跨页同名唯一化」（探测后自动变成 搜索@列表页 / 搜索@详情页） -->
  <div class="actions" style="align-items:center;">
    <input id="tb-detail-keyword"
           placeholder="输入合同编号搜索其他合同" autocomplete="off"
           style="font:inherit;flex:1;padding:7px 10px;border:1px solid #cfd4da;border-radius:6px;">
    <button id="btn-detail-search" type="button">搜索</button>
  </div>
  <div id="status" data-testid="detail-status"></div>
</div>

<script>
// 分区（F6）+ 就绪契约（F1）：与列表页同一套约定（window.__HYBRID_W / body[data-hybrid-ready]）
const W = (window.__HYBRID_W || '').toString().trim();
function apiUrl(path){
  if(!W) return path;
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'w=' + encodeURIComponent(W);
}
function markReady(){ document.body.dataset.hybridReady = '1'; }

const FIELDS = {
  'd-no':   r => r.no,
  'd-name': r => r.name,
  'd-mu':   r => r.mu,
  'd-file': r => r.file,
  'd-type': r => r.type,
  'd-cust': r => r.custName,
  'd-bu':   r => r.bu,
};

// ---- 来源模式（2026-09-17 需求⑥）----
// 从订单页点「合同编号」是用 target=_blank **新开 tab** 打开本页（带 ?from=order）：
//   · 按钮文案「返回列表」→「返回」
//   · 点击它 **关闭本 tab**（回到订单系统页面）
// 用 window.close()：只对「脚本打开的窗口」有效 —— 正常路径满足；
// 若是手工粘 URL 打开的 tab（浏览器不允许脚本关它），锚点默认跳转兜底回订单列表，不会卡死。
const fromOrder = (new URLSearchParams(location.search).get('from') || '') === 'order';
function applyBackMode(){
  if(!fromOrder) return;
  const back = document.getElementById('btn-back');
  back.textContent = '返回';
  back.setAttribute('href', '/orders.html');           // close 被拒时的兜底落点（不 preventDefault）
  back.addEventListener('click', ()=>{ window.close(); });
  document.getElementById('from-hint').textContent = '从订单系统打开';
}

async function render(){
  const no = new URLSearchParams(location.search).get('no') || '';
  const st = document.getElementById('status');
  if(!/^HT-\d+$/.test(no)){
    st.textContent = '缺少或非法的合同编号（示例：/contract_detail.html?no=HT-1005）';
    st.className = 'empty';
    document.getElementById('hint').textContent = '请带 ?no= 参数';
    markReady();     // 参数非法也算"页面已定局"，否则测试会一直等就绪
    return;
  }
  const resp = await fetch(apiUrl('/api/contract?no=' + encodeURIComponent(no)));
  if(!resp.ok){
    // 查不到就如实说 —— 绝不按编号编一份出来（那会让人以为数据是对的）
    const body = await resp.json().catch(()=>({}));
    st.textContent = body.error || ('未找到该合同: ' + no);
    st.className = 'empty';
    document.getElementById('hint').textContent = no;
    markReady();     // 查不到也是"已定局"，测试该看到的是 404 文案
    return;
  }
  const r = await resp.json();
  for(const [id, pick] of Object.entries(FIELDS)){
    document.getElementById(id).textContent = pick(r);
  }
  const dCust = document.getElementById('d-cust');
  dCust.dataset.cust = r.cust || '';       // 客户编号也留一份，便于按编号核对跨页一致
  document.getElementById('hint').textContent = r.no;
  st.textContent = '已加载详情: ' + r.no + ' ' + r.name;
  markReady();
}
applyBackMode();   // 需求⑥：从订单页（?from=order）进来时，按钮变「返回」且点击关本 tab
render();

// 详情页也可按编号搜索（跳到另一份合同的详情）—— 与列表页的「搜索」同名，
// 用于验证跨页同名唯一化；点搜索后跳到对应详情（不存在则由上面如实报「未找到」）。
document.getElementById('btn-detail-search').addEventListener('click', ()=>{
  const kw = (document.getElementById('tb-detail-keyword').value || '').trim();
  const m = kw.match(/(\d{4})/);
  const st = document.getElementById('status');
  if(!m){ st.textContent = '请输入合同编号（如 1005）'; st.className=''; return; }
  location.href = '/contract_detail.html?no=HT-' + m[1];
});
</script>
</body>
</html>
