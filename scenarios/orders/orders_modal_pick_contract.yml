# D5 · 2026-09-24 新增（项目负责人要求：补 AI 场景与关联 AI 用例）—— 一个文件 = 一个场景
id: orders_modal_pick_contract
title: 跨弹层 · 新建订单弹窗内打开合同选择弹层
description: |
  订单列表页 → 点「+ 新建订单」打开新建弹窗 → 在弹窗里点挑合同按钮打开合同选择弹层
  → 在弹层里点选编号为目标合同的那一行 → 弹层关闭、合同回填到新建订单弹窗 → 确认回填成功。
  与 contracts 那条互补：**不同模块、不同弹层**，验证跨弹层能力不是只对某一个页面成立。
tags: [跨弹层, 弹窗, 订单, p0]
priority: P0
owner: AprilPark1012
updated: 2026-09-24

target:
  url: http://localhost:8000/orders.html
  page: 订单列表页（订单表格 + 客户/业务单元筛选 + 新建订单弹窗）
  preconditions:
    - demo 已启动：python -m demo.app

scenario: |
  在订单列表页点击「+ 新建订单」按钮，打开「新建订单」弹窗；
  在弹窗里点击挑合同的按钮，打开合同选择弹层；
  在合同选择弹层里点击合同编号为 {合同编号} 的那一行，把它选中；
  确认新建订单弹窗里已经回填了该合同的编号。

data:
  - {id: "合同-HT-1005", 合同编号: "HT-1005"}

business_context: |
  · 订单页有多个弹层：新建订单弹窗（openNewOrder）、挑合同（#btn-pick-contract → 表体 #tbody-pick-contract）、
    挑客户（#btn-pick-cust → #tbody-pick-cust）、挑业务单元（#btn-pick-bu → #tbody-pick-bu）；
  · 点弹层里的**行**即选中并回填，弹层随之关闭；
  · 合同编号规则 HT-1000+i（HT-1005 存在，且它关联订单 SO-1001 —— 该对应关系是预置的）；
  · 断言只认「弹窗里出现了该合同编号」，不数总数。

  · **弹层里「点某一行」怎么写**（AI 易犯错：写成"没有元素"⇒ 框架判为坏用例、直接拒绝产出 ✗）：
    合同选择弹层里每行都有一个「选择」按钮，但语义名是**字面**的（如 `选择@HT-1001`）✗
    本场景的合同来自 data（多组值）⇒ **不能**写死某一个名字。
    ✅ 正确写法是**行内定位**：`row_text` = 该行里唯一的文本（这里就是 `{合同编号}` 本身）+
    `cell_field` = 该行「选择」按钮所在列的 field（合法值只能取提示里给的行内列清单）。

assert_guard:
  must_contain:
    - "{合同编号}"
  forbidden:
    - "共 "
    - "条订单"

notes: |
  订单页弹层更多，是"跨弹层"最有价值的战场；本场景只走一条最短链路，作为该能力的日常守门。
