# 跨角色全链路场景（2026-09-29，AprilPark1012需求）：
#   超级管理员登录 → 切订单管理员 → 选合同新建订单 → 保存 → 「查看订单」跳订单系统
#   → 按订单名称搜到它 → 看订单详情 → 编辑加 2 个订单行 → 提交整个订单
#   → 返回订单列表搜到它 → 等它自动流转到「已关闭」→ 切发票管理员 → 选中该订单「去开票」
#   → 完成发票创建 → 发票搜索栏按订单名称搜到该发票。
# ⚠️ 本场景是 **scenarios/ cases/ scripts/ 三目录清空后重建的第一个场景**（2026-09-29 19:10）。
#   ⇒ 目标是当**样板**：先把「跨角色 + 状态流转 + 跨模块（合同/订单/发票）」这条最长的业务链跑通，
#     再按 R7-f 的四层对账把用例/脚本/录像补回来。
# ⚠️ 语义名纪律：下面 scenario 段里**不写控件语义名**（探针清单为准，逐字复制，不许自己拼后缀）
#   —— 老场景 orders_return_from_contract.yml 就踩过「自己给名字拼后缀」的坑。
#   ⇒ 跑 `probe` 刷新清单后，由 explore/generate 链路把语义名对齐进来。

id: orders_invoice_full_lifecycle
title: 跨角色全链路 · 新建订单 → 提交 → 自动关闭 → 开票 → 按订单名称查发票
description: |
  一条端到端业务链，横跨**三个角色**（超管 → 订单管理员 → 发票管理员）与**三个模块**
  （合同 / 订单 / 应收发票），完整走完「新建订单 → 保存 → 查看 → 编辑加行 → 提交 → 自动关闭 → 开票 → 查发票」。
  用于验证：
  ① 角色切换后的权限实时变化（超管不自动可编，切角色才行）；
  ② 订单状态按时间自动流转（提交后 150 秒自动关闭）—— 需要**有界等待**而非固定 sleep；
  ③ 跨页面跳转与带参搜索（合同页「查看订单」→ 订单页；订单页「去开票」→ 开票页）；
  ④ 订单行增删与「提交整个订单」的落库；
  ⑤ 开票完成后发票可**按订单名称**反查（发票列表「订单名称」条件）。
tags: [e2e, orders, invoices, role_switch, lifecycle, smoke]
priority: p0
owner: AprilPark1012
updated: 2026-09-30

# [!] 场景级探测前置（probe_pre，2026-10-10 A 方案 S1）：探测期一开始就要处的身份。
#     为什么必须有：探测期若没切到「订单管理员」，详情页「编辑」是置灰(aria-disabled)状态
#     -> 前置动作点不动、编辑态控件也补探不到 -> AI 拿不到行内字段语义名 ->
#       行必填填不了 -> 保存无效 -> 提交被前端静默拒绝（订单永远到不了「已关闭」）。
#     它与页面级 pages[].pre 是**两个层级、同一个执行引擎**（_run_pre_actions）。
probe_pre:
  # ① 先点开右上角身份菜单（语义名「超」= 运行期显示名，help_text「点击切换角色 / 退出登录」）
  - 超
  # ② 再点菜单里的切换项
  #    [!] 必须两步：实测只写第 ② 步会报
  #        `Locator.click: Element is not visible` —— 菜单项在 DOM 里但**未展开时不可见**，
  #        DOM 里有 != 能点。（这条实测也是 S2「多动作序列」的由来）
  - 切换为订单管理员

pages:
  - name: 登录页
    url: http://localhost:8000/login.html
    page: |
      登录页（演示不做密码校验）：账号 + 密码。**身份 = 账号**：四个账号各带一个固定角色（contract=合同管理员 / order=订单管理员 / invoice=发票管理员 / super=超级管理员），页面上**没有角色下拉**（源码 `demo/login.html` 为准：服务端 `_SESSIONS[tok]["role"]` 取自账号）。
      ⚠️ 本场景以**超级管理员**登录，登录后右上角有头像/角色入口，可**切换当前角色**（切完权限实时变化，
      demo 侧由 `demo/auth.js` 的 `DEMO_AUTH` 实现）。
  - name: 合同列表页
    url: http://localhost:8000/
    page: |
      合同列表页（服务端 `/api/contracts`，预置 **200 条**、每屏 30 条滚动懒加载、共 7 页）：
      关键字搜索框、「搜索」「重置」「导出」「+ 新建合同」「新建订单」「查看订单」按钮；结果表格每行有单选框。
      选中某条合同后点「新建订单」⇒ 打开新建订单页并带入该合同信息。
  - name: 新建订单页
    url: http://localhost:8000/order_new.html
    page: |
      新建订单（弹层/独立页，Vue）：订单名称（必填，全系统唯一）、合同、业务单元/管理单元/帐套（各带「...」弹层）、
      订单类型（下拉）、客户/销售员（模糊搜索 + 弹层双模）、订单备注（选填）、底部「取消」「保存」。
      ⚠️ 保存按钮**需要订单管理员角色**（超管身份下置灰，点了弹提示要切角色）。
  - name: 订单列表页
    url: http://localhost:8000/orders.html
    page: |
      订单系统列表页（`/api/orders`，预置 **300 条**、每屏 20 条滚动懒加载、共 15 页）：
      搜索区 **9 个条件** = 订单名称 / 销售员 / 客户 / 业务单元 / 管理单元 / 帐套 / 状态 / **是否开票** / 合同编号；
      「搜索」「重置」右对齐，其余按钮（+ 新建订单 / 去开票 / 查看发票 / 提交 / 关闭 / 取消）在**下一行左对齐**。
      表格列含：订单编号 / 合同编号 / 订单名称 / 管理单元 / 销售员 / 订单类型 / 业务单元 / 帐套 / 客户 / 状态 / 是否开票。
      **订单编号与订单名称**点了跳订单详情页；「去开票」选中 1 条后跳到开票页并带入该订单。
  - name: 订单详情页
    url: http://localhost:8000/order_detail.html?no=SO-xxxx
    # [!] 探测前置（pages[].pre）：行内编辑控件**只在「进编辑态 + 新增行」之后才存在**
    #     （能力与二类验证 2026-09-30 就都有了，但一直没有任何场景用它 -> AI 拿不到语义名
    #      -> 行必填填不了 -> 保存无效 -> 提交被拦、状态恒「已新建」）。
    #     按**探针清单里的真实语义名**声明；探测前会依次点一次，采完即用。
    pre: ["编辑", "新增行"]
    # 探测期用的地址：详情页 url 里的订单号是**运行期才有**的值（探测期那个订单还不存在）
    # ⇒ 场景另给一个"探测时去哪个地址"。框架只认这个概念，不认识具体订单号。
    probe_url: http://localhost:8000/order_detail.html?no=SO-xxxx
    page: |
      订单详情页：基础信息 + **订单行**（含物料/产品/数量/单位/行类型/收入等字段）+ 履行状态 + 运输方式与承运商。
      「编辑」可进入编辑态，可**新增订单行**、改行内容；「提交」提交整个订单；
      底部按钮行依次是「返回」（最左）「取消」「编辑」「提交」（返回在最底部按钮行，不在 topbar）。
  - name: 开票页
    url: http://localhost:8000/invoice_create.html
    page: |
      新建应收发票：基础信息含 **订单编号**（模糊搜索联想，选中自动带入合同编号 + 业务单元/销售员/客户）、
      **合同编号**（只读）、**发票号**（系统自动生成 + 只读）、发票行（可新增行）；底部「取消」「保存」。
      ⚠️ 只能给**已关闭**的订单开票（一单一票）。
  - name: 发票列表页
    url: http://localhost:8000/invoice_list.html
    page: |
      应收发票列表（预置 **100 张**，一次取够）：搜索区 **8 个条件** = 业务单元 / 发票号 / 合同编号 / **合同名称** /
      订单编号 / **订单名称** / 销售员 / 客户，「搜索」「重置」在条件区**最下方居中**；
      合同编号与订单编号是**链接**（点了弹层看详情）；列表含「订单编号」列。

business_context: |
  判断与断言时用这些**稳定真相**：
  · **角色权限**：超管登录后**不自动获得编辑权** —— 新建/编辑订单需切「订单管理员」，开票需切「发票管理员」。
    权限不足的按钮**置灰但仍可点**，点了弹提示说明该切哪个角色（不是 `disabled`）。
  · **订单状态流转**：提交订单后按时间自动推进，**150 秒自动关闭**（履行频率 10 秒一档）。
    ⇒ 断言「已关闭」**必须用有界等待**（轮询到状态变化为止，不能固定 sleep 硬等）。
  · **一单一票**：预置发票已占用 `SO-1001…SO-1100` ⇒ 这 100 单「已关闭 + 已开票」、不能再开票。
    **本场景必须用 SO-1101 之后的订单**（自己新建的订单天然满足）。
  · **订单名称唯一**：全系统唯一（已取消的订单也占名）⇒ 场景里用带 `{datetime}` 的名称，保证可重复跑。
  · **新建的订单插在列表最前面**；订单编号由服务端分配（运行时才知道）⇒ **不要写进断言**。
  · **发票号**由系统自动生成（页面只读）⇒ 断言用「订单名称」反查，不要写死发票号。
  · **发散的风险点（跑之前先确认）**：切角色后**页面是否需要重载**、以及「等自动关闭」这段框架侧
    是用「有界等待 + 轮询状态」还是需要新动作类型 —— 若现有动作/断言表达不了，**先记缺口再补能力**（TDD 判据先行）。

# P22 批 5（方案 H）：**登录前置** —— 探测与执行两侧共用这一份声明。
# 为什么必须声明：demo 加了登录后，未登录访问业务页会被 auth.js 踢到 /login.html（探针只能探到登录页控件）；
# 而 `?demo_role=` 直连**不能切角色**（app.py:670-671 明确 400「切换角色需要真实登录会话」）。
# ⚠️ 这里是**公开的演示凭据**（登录页提示里就写着）；真实系统请改用 `password_env: 环境变量名`。
auth:
  login_api: /api/login
  username: super
  password: super@123
  token_key: demo_token

assert_guard:
  must_contain: ["订单", "发票"]
  forbidden: ["共 ", "命中 "]

scenario: |
  1. 以**超级管理员**登录系统。
  2. 切换到**订单管理员**角色（不切的话下一步的保存按钮是置灰的）。
  3. 进入合同列表页，**选中一条合同**（第一行，HT-1001）。
     ⚠️ 点「新建订单」在 demo 里打开的是 **iframe 弹层**（探测链路暂不覆盖弹层内控件，已单独立项）；
     故本条走**等价直达**：打开新建订单页并把该合同带进去（`order_new.html?contract_no=HT-1001`）。
  4. 在新建订单页填写：订单名称用「全链路-{datetime}」、合同已带入、业务单元/管理单元/帐套各选第一行、
     订单类型选第一项、客户与销售员各选第一个、订单备注填「端到端全链路场景」；点「保存」。
  5. 回到合同列表页点「查看订单」跳到订单系统页面；在**订单名称**搜索框输入刚填的订单名称，点「搜索」，
     列表里出现这条订单。
  6. 点这条订单的**订单名称**进入订单详情页；点「编辑」进入编辑态（进编辑态后行工具栏的
     「新增行 / 保存 / 取消」才可用，只读态是置灰的）。
     然后**新增 2 个订单行**：每新增一行都要**填满该行的 4 个必填项**（物料编码 / 产品编码 / 数量 / 行类型），
     两行都填好后，点**行工具栏里的「保存」**把订单行**先保存**下来。
     ⚠️ 业务前提（必须遵守，否则后面白给）：**页面上有未保存的修改时，点「提交」不会生效**
     —— 它只会提示「请先点保存再提交」，订单不会真的被提交、状态也不会开始流转。
     所以顺序必须是「填行 → 保存行 → 再提交」。
     最后点底部的**「提交」**提交整个订单（提交成功后订单进入履行状态，开始按时间自动流转）。
  7. 点底部「返回」回到订单列表；用订单名称搜索找到它，**等待**它的状态自动流转到「已关闭」。
     该流转是**按时间自动推进**的：提交订单后**最长约 150 秒**才会变成「已关闭」，所以这一步要
     **有界等待**（轮询到状态变化为止），既不要固定 sleep 硬等，也不要只等几秒就判失败。
  8. 切换到**发票管理员**角色；在订单列表里**选中该订单**，点「去开票」。
  9. 在开票页确认订单编号/合同编号已带入（发票号是系统生成的），填写发票行后点「保存」，完成发票创建。
  10. 进入发票列表页，在**订单名称**搜索框输入该订单名称，点「搜索」⇒ 能搜到刚创建的那张发票。
