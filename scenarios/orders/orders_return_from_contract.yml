# 跨 tab 端到端场景（2026-09-17，AprilPark1012需求）：
#   合同列表页点「查看订单」→ 新 tab 开订单系统 → 新建退货订单 → 列表第一条就是它
#   → 点这一行的合同编号 → 再开新 tab 看合同详情 → 点「返回」关掉该 tab 回到订单列表。
# ⚠️ 本场景跨的是 **tab**（多窗口），不是同一 tab 内换页 ⇒ 用到 click_new_tab / close_tab
#    与行内定位（row_text + cell_field）——这三个能力是 2026-09-17 为它加进框架的。
id: orders_return_from_contract
title: 跨 tab 流程 · 合同页新建退货订单并查看订单详情
description: |
  从合同列表页经「查看订单」新开 tab 进入订单系统 → 新建一张「退货订单」（合同/业务单元/管理单元/帐套
  走弹层选值，客户/销售员走弹层选，订单类型=退货订单）→ 提交后核对列表第一条就是它
  → 点该行的合同编号再开一个 tab 看合同详情 → 点「返回」关闭该 tab 回到订单列表。
  用于验证多 tab 能力（click_new_tab / close_tab）、行内定位（新建行的合同编号）与首行断言。
tags: [cross_tab, orders, smoke]
priority: p0
owner: AprilPark1012
updated: 2026-09-17

pages:
  - name: 合同列表页
    url: http://localhost:8000/
    page: |
      合同列表页（数据来自服务端 /api/contracts，**预置 20 条**；每条用例开始前框架会复位数据）：
      关键字搜索框、「搜索」「重置」「导出（禁用）」按钮、「+ 新建合同」按钮、结果表格，
      表格第 1 列合同编号是链接（点它**当前页**跳合同详情页）。
      ⚠️ 页面右上角有一个「查看订单」链接（`target="_blank"`）—— 点它会**新开一个 tab** 打开订单系统页。
  - name: 订单系统
    url: http://localhost:8000/orders.html
    page: |
      订单系统列表页（数据来自服务端 /api/orders，**预置 60 条、每页 20 条、共 3 页**；每条用例开始前复位）：
      顶部有「合同管理」链接与「+ 新建订单」按钮；筛选区有 订单名称（全模糊）/销售员（右模糊=前缀）/
      客户（全模糊）三个输入框，业务单元/管理单元/帐套三个只读框各配一个「...」按钮（点开弹层选值）；
      「搜索」「重置」按钮；表格列依次是 订单编号 / 合同编号 / 订单名称 / 管理单元 / 销售员 / 订单类型 /
      业务单元 / 帐套 / 客户；表格下方是分页（上一页/页码/下一页）。
      行内链接：**订单编号与订单名称**点了是**当前页**跳订单详情页；
      **合同编号**是 `target="_blank"` ⇒ 点了**新开一个 tab** 打开合同详情页（URL 带 from=order）。
      「新建订单」弹窗字段（全部必填，除订单备注）：订单名称（文本）、合同（「选择合同」按钮 + 弹层）、
      业务单元/管理单元/帐套（各一个「...」按钮 + 弹层）、订单类型（下拉：标准销售订单/退货订单/服务订单/电商订单）、
      客户（「选择客户」按钮 + 弹层，弹层有「取消」）、销售员（「选择销售员」按钮 + 弹层，弹层有「取消」）、
      订单备注（选填）、底部「取消」「提交」按钮。
  - name: 合同详情页
    url: http://localhost:8000/contract_detail.html?no=HT-1001&from=order
    page: |
      合同详情页：显示合同编号/名称/管理单元/帐套/合同类型/客户/业务单元（来自服务端
      /api/contract?no= 的同一条记录）。
      ⚠️ 带 `from=order` 进来时（=从订单页点合同编号打开的那个 tab），底部按钮文案是「返回」，
      点它是**关闭本 tab**（回到订单系统页面），不是跳转。

business_context: |
  三条页面/数据规则（判断断言与动作时用）：
  · **弹层选值**：业务单元/管理单元/帐套/合同 四类弹层每行都有「选择」按钮（文字全一样，靠所在行区分）；
    客户/销售员弹层同样每行一个「选择」按钮，另外有「取消」。选中即回填只读框并关闭弹层。
  · **新建的订单会插在列表最前面** ⇒ 提交后**第一行**就是刚建的那张单，可以用「第一行某列 == 刚填的值」来验
    （订单名称是我们自己填的，服务端还会分配订单编号 SO-2xxx —— 编号是运行时才知道的，不要写进断言）。
  · **订单数据按序号确定**（可硬断言的稳定值）：预置 60 条 = SO-1001…SO-1060，名称 订单1…订单60；
    合同编号 = HT-1001…HT-1020 循环（SO-1001→HT-1001、SO-1002→HT-1002…）；订单类型四种循环
    （SO-1001 标准销售订单、SO-1002 退货订单、SO-1003 服务订单、SO-1004 电商订单…）。
    合同弹层里第一条是 HT-1001（名称 合同1）⇒ 选中它以后，订单行/合同详情页都应显示 HT-1001 与 合同1。
  · 「返回」按钮有两个页面上都有：合同详情页的「返回」在 from=order 模式下是**关 tab**；
    订单详情页的「返回」是回订单列表（本场景不走订单详情页）。
  · **新建订单弹窗里的按钮，语义名请逐字用下面这些**（探针实测名）：
    `选择合同` · `选择业务单元@新建订单` · `选择管理单元@新建订单` · `选择帐套@新建订单` ·
    `选择客户@订单系统` · `选择销售员`。
    ⚠️ 列表页筛选区也有「同名」按钮，它们的名字**不带** `@新建订单` 后缀（如 `选择业务单元`），
    **别混用**；也**不要**给 `选择客户`/`选择销售员` 硬套 `@新建订单`（清单里没有这种名字）。
    弹层里逐行的按钮：合同弹层 `选择@HT_1001`、业务单元 `选择@bu_a`、客户 `选择@北京华信科技有限公司@订单系统`、销售员 `选择@张伟`。
  · ⚠️ 断言里**不许**写「共 N 条」「命中 N 条」这类运行时计数，也不许写服务端分配的订单编号。

assert_guard:
  must_contain: ["退货订单"]
  forbidden: ["共 ", "命中 "]

scenario: |
  打开合同列表页，点击右上角的「查看订单」，系统会**新开一个 tab** 打开订单系统页面（订单列表页）；
  在该页点击「+ 新建订单」按钮，弹出「新建订单」弹窗：
  填写订单名称（用「退货订单-{datetime}」这个值）；
  点击「选择合同」打开合同弹层，选第一行（HT-1001）的「选择」；
  点击业务单元旁的「...」按钮打开弹层选第一行，同样方式给管理单元、帐套各选第一行；
  订单类型下拉选「退货订单」；
  点击「选择客户」选第一个客户，点击「选择销售员」选第一个销售员；
  在订单备注里填「AI 端到端自动化用例」；
  点击「提交」，弹窗关闭、订单列表刷新，确认**列表第一行的订单名称**就是我们刚填的那个订单名称；
  然后在订单列表里点击这一行的「合同编号」链接，它会**新开一个 tab** 打开该合同的详情页，
  确认新 tab 的 URL 是合同详情页且页面显示合同编号 HT-1001、合同名称 合同1；
  最后点击该详情页的「返回」按钮，这个 tab 被关闭，回到订单列表页面（确认还在订单列表页）。
