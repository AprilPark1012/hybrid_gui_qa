id: contracts_modal_pick_customer
title: 跨弹层 · 新建合同弹窗内打开客户选择弹层
description: |
  合同列表页 → 点「+ 新建合同」打开新建弹窗 → 在弹窗内点「选择客户」打开客户列表弹层
  → 在弹层里点选一个客户 → 弹层关闭、客户回填到新建弹窗 → 确认回填成功。
  用于验证**跨弹层**能力（弹窗里再开弹层）：弹层内控件的定位与回填链路。
tags: [跨弹层, 弹窗, p0]
priority: P0
owner: AprilPark1012
updated: 2026-09-24

target:
  url: http://localhost:8000/
  page: 合同列表页（合同列表 + 多条件搜索 + 新建弹窗）
  preconditions:
    - demo 已启动：python -m demo.app

scenario: |
  在合同列表页点击「+ 新建合同」按钮，打开「新建合同」弹窗；
  在新建弹窗里点击「选择客户」按钮，打开客户列表弹层；
  在客户列表弹层里点击客户「{客户名称}」所在的那一行，把它选中；
  确认新建弹窗里的客户输入框已经回填为该客户名称。

data:
  - {id: "客户-上海远东", 客户名称: "上海远东贸易有限公司"}

business_context: |
  · 两级弹层：新建合同弹窗（#modal-new）里有「选择客户」按钮（#btn-pick-c），
    点它打开**客户列表弹层**（#modal-customer，表体 #tbody-customers）；
  · 点客户列表弹层里的**行**即选中该客户，弹层随即关闭，并把客户名回填到新建弹窗的输入框；
  · 客户主数据 6 条（c1 北京华信科技有限公司 / c2 上海远东贸易有限公司 / c3 广州南方物流有限公司 /
    c4 深圳前海数据服务有限公司 / c5 北京中科智慧科技有限公司 / c6 成都天府软件有限公司）；
  · 断言只认「回填后的输入框里出现了该客户名称」，不要去数客户总条数。

  · **弹层里「点某一行」怎么写**（AI 易犯错：写成"没有元素"⇒ 框架判为坏用例、直接拒绝产出 ✗）：
    弹层里每行都有一个「选择」按钮，但它们的语义名是**字面**的（如 `选择@北京华信科技有限公司`）✗
    本场景的客户来自 data（多组值）⇒ **不能**写死某一个名字。
    ✅ 正确写法是**行内定位**：`row_text` = 该行里唯一的文本（这里就是 `{客户名称}` 本身）+
    `cell_field` = 该行「选择」按钮所在列的 field（合法值只能取提示里给的行内列清单）。

assert_guard:
  must_contain:
    - "{客户名称}"
  forbidden:
    - "共 "
    - "条记录"

notes: |
  跨弹层的最小可信链路；弹层内的定位必须走语义（可见文本/角色），不依赖埋点（生产环境弹层内部没有埋点）。
