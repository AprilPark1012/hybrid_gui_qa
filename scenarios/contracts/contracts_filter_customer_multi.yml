# D5 · 2026-09-24 新增（项目负责人要求：补 AI 场景与关联 AI 用例）—— 一个文件 = 一个场景
id: contracts_filter_customer_multi
title: 合同列表 · 客户名称前缀筛选（多套数据）
description: |
  在客户名称输入框输入客户名称前缀 → 点搜索 → 确认结果里出现该客户的合同记录。
  数据参数化：一组数据 = 一条用例，报告里独立一行。
tags: [合同, 筛选, 多套数据, p0]
priority: P0
owner: AprilPark1012
updated: 2026-09-24

target:
  url: http://localhost:8000/
  page: 合同列表页（合同列表 + 多条件搜索）
  preconditions:
    - demo 已启动：python -m demo.app

scenario: |
  在合同列表页的「客户名称」输入框里输入 '{客户关键词}'，点击搜索按钮，
  确认结果表格里出现了客户为「{期望客户}」的合同记录。

data:
  - {id: "客户-北京", 客户关键词: "北京", 期望客户: "北京华信科技有限公司"}
  - {id: "客户-上海", 客户关键词: "上海", 期望客户: "上海远东贸易有限公司"}
  - {id: "客户-广州", 客户关键词: "广州", 期望客户: "广州南方物流有限公司"}

business_context: |
  · 客户筛选是**输入框 + 右模糊（前缀）匹配**（2026-09-14 起客户不再是下拉框）；
    「北京」会同时命中 c1 北京华信科技有限公司 与 c5 北京中科智慧科技有限公司
    ⇒ 断言只要求**目标客户的那条记录出现**，不要求"只出现一条"；
  · 客户按序号确定：HT-1001→c1、HT-1002→c2 …（合同与客户的对应关系是预置的）；
  · 不要断言"命中 N 条"——N 是运行时算出来的。

assert_guard:
  must_contain:
    - "{期望客户}"
  forbidden:
    - "共 "
    - "条合同"

notes: |
  与 contracts_search_by_no（编号搜索）互补：那条测编号，本条测**客户前缀**，覆盖面更宽。
