# 2026-09-14 新增（AprilPark1012需求①+②）：客户改成「弹层列表里选一行」之后，
# 一条场景串起两件事：弹层选客户 → 提交成功 → 再用列表页的客户右模糊筛选把它捞出来。
id: contracts_create_and_filter_by_customer
title: 新建合同（客户从弹层列表选择）→ 按客户右模糊筛选
description: |
  打开新建弹窗 → 填必填字段 → 点「选择客户」在弹层客户列表里选「北京华信科技有限公司」
  → 提交 → 断然列表出现新合同 → 再在客户筛选框输入「北京华信」搜索 → 新合同仍在结果里。
  验证两处新交互：①客户弹层列表选择 ②列表页客户右模糊（前缀）筛选。
tags: [合同, 新建, 客户, regression]
priority: P1
owner: AprilPark1012
updated: 2026-09-14

target:
  url: http://localhost:8000
  page: |
    合同列表页。新建走弹窗；弹窗里的客户是「请选择客户」只读输入框 + 「选择客户」按钮，
    点它会**再弹一层客户列表**（两列：客户名称 / 客户地址）。
    列表页的客户筛选是**输入框 + 右模糊（前缀）匹配**。
  preconditions:
    - demo 已启动：python -m demo.app

scenario: |
  点击“新建合同”按钮打开弹窗；
  填写合同名称“合同_{datetime}”，管理单元选 0021，帐套选 001，合同类型选 合同；
  点击“选择客户”按钮，在弹出的客户列表里选择「北京华信科技有限公司」那一行（点该行的“选择”按钮）；
  业务单元选 bu_a；
  点击“提交”按钮；
  确认列表中出现刚填写的合同名称“合同_{datetime}”；
  然后在本页的客户筛选输入框里输入“北京华信”，点击“搜索”按钮，
  确认搜索结果里仍然有刚填写的合同名称“合同_{datetime}”。

business_context: |
  【客户弹层】客户不再是下拉框：弹窗里是只读输入框「请选择客户」+ 按钮「选择客户」；
  点「选择客户」弹出**客户列表层**（表头：客户名称 / 客户地址 / 操作），6 个客户：
  北京华信科技有限公司、上海远东贸易有限公司、广州南方物流有限公司、
  深圳前海数据服务有限公司、北京中科智慧科技有限公司、成都天府软件有限公司；
  每行末尾是「选择」按钮 —— **6 个按钮文字完全一样**，只能按所在行区分
  （探测后语义名形如 选择@北京华信科技有限公司）；选中后回填客户名称并关闭弹层。
  客户是必填：没选就提交会提示“请填写全部必填字段”。
  【客户右模糊】列表页客户筛选是输入框，**右模糊 = 前缀匹配**（客户名称前缀或客户编号前缀）：
  输入“北京”命中（北京华信科技/北京中科智慧 两家），输入“北京华信”命中一家，
  输入“华信”这种**非前缀不命中** —— 别把它当包含匹配。
  状态行形如“搜索完成，命中 N 条（客户右模糊「北京华信」）”；N 是运行时才知道的，**不要**断言条数。
  数据在**服务端**（demo/app.py）：编号由服务端分配（HT-2xxx 起）、页面刷新不丢；
  每条用例开始前框架会自动复位数据（POST /api/reset）⇒ 列表页固定 20 条预置。

assert_guard:
  must_contain:
    - "已新增合同"
  forbidden:
    - "请填写全部必填字段"

notes: |
  这条场景的重点是「从弹层列表里选一行」——弹层里的控件默认探测不到，框架会自动点开弹层再探
  （有界：≤2 层、每层 ≤2 次点击），并给同名的「选择」按钮按所在行命名。
  断言设计：客户是必填项，弹层选择若没生效，提交会被拦（状态行变成“请填写全部必填字段”），
  所以「新合同名出现在列表里」这条断言能兜住弹层选择是否真的生效。
