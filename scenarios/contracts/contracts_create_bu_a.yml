id: contracts_create_bu_a
title: 合同列表 · 新建合同（客户从弹层列表里选）
description: 打开新建弹窗 → 填必填字段（客户走「选择客户」弹层列表）→ 提交 → 列表出现刚建的数据
tags: [合同, 新建, regression]
priority: P1
owner: AprilPark1012
updated: 2026-09-14

target:
  url: http://localhost:8000
  page: 合同列表页（新建走弹窗：合同名称/管理单元/帐套/合同类型/客户/业务单元）
  preconditions:
    - demo 已启动：python -m demo.app

scenario: |
  点击“新建合同”按钮打开弹窗；
  填写合同名称“合同_{datetime}”，管理单元选 0021，帐套选 001，合同类型选 合同；
  点击“选择客户”按钮，在弹出的客户列表里选「北京华信科技有限公司」那一行（点该行的“选择”按钮）；
  业务单元选 bu_a；
  点击“提交”按钮；
  确认列表中出现刚填写的合同名称“合同_{datetime}”。

business_context: |
  ⚠️ 2026-09-14 起客户**不再是下拉框**：弹窗里是只读输入框「请选择客户」+ 按钮「选择客户」；
  点「选择客户」会**再弹一层客户列表**（两列：客户名称 / 客户地址，6 个客户），
  每行末尾有一个「选择」按钮 —— 6 个按钮文字完全相同，只能靠所在行区分
  （探测后它们的语义名形如 选择@北京华信科技有限公司）；选中后自动回填客户名称并关掉弹层。
  客户是必填：没选就提交会提示“请填写全部必填字段”。
  其余字段：合同名称(自由文本)、管理单元=0021/0451/1031、帐套=001/002/003、
  合同类型=合同/po/预po、业务单元=bu_a/bu_b/bu_c —— 共 6 项必填；
  提交成功后：列表自动刷新并出现新记录，底部状态行形如“已新增合同: HT-2xxx 合同_xxxx”；
  合同名称必须唯一，用 {datetime} 占位符生成，避免反复重跑撞名。
  数据在**服务端**（demo/app.py）：编号由服务端分配（HT-2xxx 起）、页面刷新不丢；
  每条用例开始前框架会自动复位数据（POST /api/reset）⇒ 列表页固定 20 条预置。

assert_guard:
  must_contain: []          # 名称是动态的（{datetime}），由框架占位符在运行时固化，不写死
  forbidden:
    - "请填写全部必填字段"    # demo 的失败提示，绝不能被当成正常期望值

data:                       # 二期：参数化（一期只解析不展开）
  - {mu: "0021", file: "001", type: "合同", customer: "北京华信科技有限公司", bu: "bu_a"}

notes: |
  主检查点用“新建输入的合同名出现在列表里”（不依赖后端返回编号）。
  客户是必填项 ⇒ 这条断言顺带兜住了「弹层选择是否真的生效」：
  弹层没选上，提交会被拦下（状态行变成“请填写全部必填字段”），断言必然失败。
