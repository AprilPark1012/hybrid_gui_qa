# 一个文件 = 一个场景；文件名 = 场景 id
id: contracts_search_by_no
title: 合同列表 · 按编号搜索
description: 输入合同编号片段 → 点搜索 → 确认列表出现对应编号的记录
tags: [合同, 搜索, smoke]
priority: P0
owner: AprilPark1012
updated: 2026-09-21

target:
  url: http://localhost:8000
  page: 合同列表页（合同列表 + 多条件搜索 + 新建弹窗）
  preconditions:
    - demo 已启动：python -m demo.app

# —— AI 语义识别的输入：自然语言动作流（等价于 --scenario 的字符串）——
scenario: |
  在合同列表页面的搜索框输入 '{关键词}'，点击搜索按钮，
  确认结果列表里出现编号为 {期望编号} 的合同记录。

# —— 数据参数化（L1 · 2026-09-21 落地）：一组数据 = 一条用例（报告里独立一行）——
# 占位符写在 scenario 文案里（{关键词} / {期望编号}），这里每组给一组值；
# 组值必须**恰好**覆盖文案里用到的占位符（少了会被拦：未解析的 {xxx} 会被原样填进页面）。
# id 可选：给了就进报告里的用例名（如 test_xxx[编号-1007]），便于单组定位。
data:
  - {id: "编号-1005", 关键词: "1005", 期望编号: "HT-1005"}
  - {id: "编号-1007", 关键词: "1007", 期望编号: "HT-1007"}
  - {id: "编号-1020", 关键词: "1020", 期望编号: "HT-1020"}

# —— 领域上下文：帮 AI 挑对控件、判断数据规则 ——
business_context: |
  关键字搜索框的 placeholder 是“合同编号/名称/管理单元/合同类型/帐套”，名称列模糊匹配；
  合同编号规则 HT-1000+i（输入片段 1005 ⇒ 目标记录编号 HT-1005）；
  页面底部状态行文案形如“搜索完成，命中 N 条”——N 是运行时才知道的，不作断言。

# —— 断言护栏：事前喂给 AI，事后落盘硬校验 ——
assert_guard:
  # 数据驱动后护栏也走占位符：校验口径是「断言期望值里必须出现这个占位符」
  #（原来写死 HT-1005，换成 3 组数据后那样会误报"断言没覆盖护栏"）
  must_contain:
    - "{期望编号}"
  forbidden:
    - "共 "
    - "条合同"

notes: |
  **本场景是数据参数化的样板**（L1）：3 组数据 ⇒ 生成 3 条用例，各占报告一行；改数据只改 data:。
  按编号搜最稳：编号是确定性生成的（HT-1000+i）。
  不要用“共 N 条”当断言 —— 实测翻车过一次（AI 编了个数字）。
