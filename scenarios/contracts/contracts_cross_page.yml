# P3 跨页流程示例（一个文件 = 一个场景）
# 真跨页链路：列表页搜索 → 点编号进详情页 → 回列表再搜索。
# pages 与 target.url **互斥**（多页写 pages）；每页都要给完整 http 地址（AI 要能直连）。
id: contracts_cross_page
title: 跨页流程 · 按编号进详情页并核验
description: |
  列表页按编号搜索 → 点结果里的编号链接进入合同详情页 → 核验详情页的编号与名称
  → 用「返回列表」回到列表页 → 再搜索一次确认列表仍在。
  用于验证 P3 跨页能力：多页探测、跨页同名唯一化、换页必须有 url 断言。
tags: [cross_page, smoke]
priority: p0
owner: AprilPark1012
updated: 2026-09-14

pages:
  - name: 列表页
    url: http://localhost:8000/
    page: |
      合同列表页（数据来自服务端 /api/contracts，**预置 20 条**；每条用例开始前框架会复位数据）：
      关键字搜索框（合同编号/名称/管理单元/合同类型/帐套）、
      **客户筛选 = 输入框 + 右模糊（前缀）匹配**、业务单元下拉（2026-09-14 起客户不再是下拉框）、
      「搜索」「重置」「导出（禁用）」按钮、+ 新建合同（弹窗：客户走「选择客户」客户列表弹层）、结果表格。
      **表格第 1 列的合同编号是链接**，点它会跳到合同详情页。
  - name: 详情页
    url: http://localhost:8000/contract_detail.html?no=HT-1005
    page: |
      合同详情页：显示合同编号/名称/管理单元/帐套/合同类型/客户/业务单元 —— 这七个字段都来自
      **服务端 /api/contract?no= 的同一条记录**（与列表页天然一致）；
      底部有「返回列表」链接与「编辑（未接入）」按钮；另有一个按编号搜索其他合同的输入框+搜索按钮。
      编号不存在时如实显示「未找到该合同」且单元格保持「—」。

business_context: |
  领域规则（判断断言时用）：
  · 合同编号形如 HT-1005；列表页点编号 → /contract_detail.html?no=<编号>；
  · 数据在**服务端**（/api/contracts、/api/contract?no=，见 demo/app.py）：列表页与详情页读的是**同一条记录**
    ⇒ 预置的 HT-1005 七个字段**跨页完全一致**，可以断言（如客户：列表页 td[data-field=customer][data-cust]=c5
    ⇒ 详情页 detail-cust 的 data-cust 也是 c5）；
  · 客户按序号确定（HT-1001→c1、…、HT-1006→c6、HT-1007→c1、…），所以客户名称/编号都能硬断言；
  · 详情页对**不存在的编号**如实报「未找到该合同」，**不会**编造数据；
  · 列表页客户筛选 = 输入框 + 右模糊（前缀）匹配（客户名称前缀或客户编号前缀；「华信」这种非前缀不命中）；
  · 列表页固定 20 条预置（每条用例开始前复位；新建用例写进去的数据不会带到下一条）；
  · 列表页「搜索」与详情页「搜索」是两个不同按钮，探测后名字带 @页名 后缀以示区分。

assert_guard:
  must_contain: ["HT-1005", "合同5"]
  forbidden: ["共 ", "命中 "]

scenario: |
  打开合同列表页，在关键字搜索框输入 1005 并点击搜索；
  点击结果行里的编号链接 HT-1005 进入合同详情页，确认已经换页（URL 含 contract_detail）
  且详情页显示了编号 HT-1005 与名称 合同5；
  然后点击「返回列表」回到列表页，再在关键字搜索框输入 1005 并点击搜索，确认列表里仍有 HT-1005。
